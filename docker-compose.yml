services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.20.4"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "minecraft"
      MEMORY: "2G"
      DIFFICULTY: "normal"
      SPAWN_PROTECTION: "0"
      ENABLE_AUTOPAUSE: "FALSE"
      MODRINTH_PROJECTS: "skinsrestorer"
    ports:
      - "25565:25565"
      - "25575:25575"
    volumes:
      - minecraft-data:/data
    healthcheck:
      test: mc-monitor status --host localhost --port 25565
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  brain:
    build:
      context: ./packages/brain
      dockerfile: Dockerfile.dev
    environment:
      BRAIN_PORT: "5000"
      SCENARIO: "${SCENARIO:-gold-mining}"
      NODE_ENV: "development"
      PROTO_PATH: "/app/proto/cubert.proto"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    ports:
      - "5000:5000"
      - "9230:9230"
    volumes:
      - ./packages/brain/src:/app/src
      - ./proto:/app/proto
      - brain-node-modules:/app/node_modules
    command: npx tsx src/index.ts
    depends_on:
      minecraft:
        condition: service_healthy

  body:
    build:
      context: ./packages/body
      dockerfile: Dockerfile.dev
    environment:
      MC_HOST: "minecraft"
      MC_PORT: "25565"
      MC_VERSION: "1.20.4"
      BOT_USERNAME: "Cubert"
      BRAIN_HOST: "brain"
      BRAIN_PORT: "5000"
      NODE_ENV: "development"
      PROTO_PATH: "/app/proto/cubert.proto"
    ports:
      - "9229:9229"
      - "9091:9091"
    volumes:
      - ./packages/body/src:/app/src
      - ./proto:/app/proto
      - body-node-modules:/app/node_modules
    command: npx tsx src/index.ts
    depends_on:
      brain:
        condition: service_started
      minecraft:
        condition: service_healthy

  scenario:
    build:
      context: ./tools/scenario-runner
    environment:
      MC_HOST: "minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: "minecraft"
      BOT_USERNAME: "Cubert"
      BOT_SKIN: "${BOT_SKIN:-}"
      SCENARIO: "${SCENARIO:-gold-mining}"
    volumes:
      - ./scenarios:/scenarios:ro
    depends_on:
      body:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  loki:
    image: grafana/loki:3.4.3
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  minecraft-data:
  brain-node-modules:
  body-node-modules:
  prometheus-data:
  loki-data:
  grafana-data:
