syntax = "proto3";

package cubert;

option optimize_for = SPEED;

// ============================================================================
// BRAIN SERVICE - Brain is the gRPC server, Body is the client
// ============================================================================

service BrainService {
  // Bidirectional stream: Body sends BodyMessage (sensors or events), Brain sends actions
  rpc Connect(stream BodyMessage) returns (stream Action);

  // Health check
  rpc Ping(PingRequest) returns (PingResponse);
}

// ============================================================================
// BODY MESSAGE WRAPPER - Body -> Brain (supports both sensor data and events)
// ============================================================================

message BodyMessage {
  oneof payload {
    SensorData sensor_data = 1;
    ActionEvent action_event = 2;
    ConnectEvent connect_event = 3;
    ChatMessage chat_message = 4;
  }
}

message ChatMessage {
  fixed64 timestamp = 1;
  string sender = 2;
  string message = 3;
}

message ConnectEvent {
  fixed64 timestamp = 1;
  SensorData initial_sensor_data = 2;
}

message ActionEvent {
  fixed64 timestamp = 1;
  string action_id = 2;
  ActionResult result = 3;
  optional string error_message = 4;
  ActionEventType event_type = 5;
}

enum ActionEventType {
  ACTION_EVENT_UNSPECIFIED = 0;
  ACTION_EVENT_STARTED = 1;
  ACTION_EVENT_COMPLETED = 2;
}

// ============================================================================
// SENSOR DATA - Body -> Brain
// ============================================================================

message SensorData {
  fixed64 timestamp = 1;              // Unix timestamp in ms
  string bot_id = 2;                  // Bot identifier

  PositionData position = 3;
  InventoryData inventory = 4;
  HealthData health = 5;
  BlocksData nearby_blocks = 6;
  PathStatus path_status = 7;
  repeated PlayerInfo nearby_players = 8;
}

message PlayerInfo {
  string username = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  float distance = 5;                 // Distance from bot
}

message PositionData {
  double x = 1;
  double y = 2;
  double z = 3;
  float yaw = 4;
  float pitch = 5;
  bool on_ground = 6;
}

message InventoryData {
  repeated InventorySlot slots = 1;
  int32 selected_slot = 2;
}

message InventorySlot {
  int32 slot_index = 1;
  string item_name = 2;               // e.g., "gold_ore", "cobblestone"
  int32 count = 3;
}

message HealthData {
  float health = 1;                   // 0-20
  float food = 2;                     // 0-20
  float saturation = 3;
  float oxygen = 4;                   // 0-20
}

message BlocksData {
  repeated BlockInfo gold_blocks = 1;
  repeated BlockInfo lava_blocks = 2;
  repeated BlockInfo chest_blocks = 3;
  repeated BlockInfo hazard_blocks = 4;
}

message BlockInfo {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  string block_name = 4;
  float distance = 5;                 // Distance from bot
}

message PathStatus {
  PathState state = 1;
  bool is_moving = 2;
  bool is_mining = 3;
  optional BlockInfo target_block = 4;
}

enum PathState {
  PATH_STATE_UNSPECIFIED = 0;
  PATH_STATE_IDLE = 1;
  PATH_STATE_COMPUTING = 2;
  PATH_STATE_FOLLOWING = 3;
  PATH_STATE_REACHED = 4;
  PATH_STATE_FAILED = 5;
}

enum ActionResult {
  ACTION_RESULT_UNSPECIFIED = 0;
  ACTION_RESULT_SUCCESS = 1;
  ACTION_RESULT_FAILED = 2;
  ACTION_RESULT_IN_PROGRESS = 3;
  ACTION_RESULT_CANCELLED = 4;
}

// ============================================================================
// ACTIONS - Brain -> Body
// ============================================================================

message Action {
  string action_id = 1;
  fixed64 timestamp = 2;
  ActionType type = 3;

  oneof payload {
    MoveToAction move_to = 10;
    MineBlockAction mine_block = 11;
    DepositItemsAction deposit_items = 12;
    SpeakAction speak = 13;
    IdleAction idle = 14;
    CancelAction cancel = 15;
    WithdrawItemsAction withdraw_items = 16;
  }
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_MOVE_TO = 1;
  ACTION_TYPE_MINE_BLOCK = 2;
  ACTION_TYPE_DEPOSIT_ITEMS = 3;
  ACTION_TYPE_SPEAK = 4;
  ACTION_TYPE_IDLE = 5;
  ACTION_TYPE_CANCEL = 6;
  ACTION_TYPE_WITHDRAW_ITEMS = 7;
}

message MoveToAction {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;

  HazardConfig hazards = 4;
  LiquidConfig liquids = 5;
  LocomotionConfig locomotion = 6;
  PathfindingConfig pathfinding = 7;
}

message HazardConfig {
  int32 buffer_distance = 1;
  int32 scan_radius = 2;
  int32 scan_count = 3;
  int32 vertical_buffer_min = 4;
  int32 vertical_buffer_max = 5;
  repeated string hazard_blocks = 6;
  repeated string blocks_to_avoid = 7;
  repeated string blocks_cant_break = 8;
}

message LiquidConfig {
  repeated string treat_as_air = 1;
  int32 liquid_cost = 2;
}

message LocomotionConfig {
  bool can_dig = 1;
  bool allow_parkour = 2;
  bool allow_sprinting = 3;
}

message PathfindingConfig {
  int32 goal_range = 1;
  int32 max_attempts = 2;
  int32 retry_delay_ms = 3;
}

message MineBlockAction {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message DepositItemsAction {
  int32 chest_x = 1;
  int32 chest_y = 2;
  int32 chest_z = 3;
  repeated string item_names = 4;     // Items to deposit (empty = all)
}

message SpeakAction {
  string message = 1;
}

message IdleAction {
  int32 duration_ms = 1;
}

message CancelAction {
  string target_action_id = 1;
}

message WithdrawItemsAction {
  int32 chest_x = 1;
  int32 chest_y = 2;
  int32 chest_z = 3;
  repeated string item_names = 4;     // Items to withdraw (empty = all)
  int32 count = 5;                    // Max count per item (0 = all available)
}

// ============================================================================
// UTILITY MESSAGES
// ============================================================================

message PingRequest {
  string bot_id = 1;
}

message PingResponse {
  bool ready = 1;
  string scenario = 2;
}
