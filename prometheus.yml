global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'cubert-body'
    static_configs:
      - targets: ['body:9091']

  - job_name: 'cubert-brain'
    static_configs:
      - targets: ['brain:9092']
