<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubert Log Archiver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Cubert Log Archiver</h1>
    </header>

    <div id="breadcrumb" class="breadcrumb" style="display:none;"></div>
    <div id="app">
      <div class="loading">Loading batches...</div>
    </div>
  </div>

  <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <span class="drawer-title" id="drawer-title">Line Details</span>
      <button class="drawer-close" onclick="closeDrawer()">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
